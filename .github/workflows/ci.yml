name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and PGlite integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency license gate (informational)
        run: npm run licenses
        continue-on-error: true

# Browser acceptance is intentionally not wired into CI.
# tests/browser/** target the `msedge` channel pinned in playwright.config.ts, which needs a real
# Edge installation; running it locally against a live server on port 3100 is the supported path
# (`npm start` then `npm run test:browser`). PostgreSQL-specific coverage lives in
# `npm run test:postgres` and needs a local cluster as described in docs/POSTGRES_ACCEPTANCE.md.
